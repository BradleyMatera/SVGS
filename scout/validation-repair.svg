<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Scout validation and repair loop</title><desc id="d">A loop showing model generation, claim validation, rejection diagnostics, and repair using the same contract.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#17110a"/><stop offset="1" stop-color="#1d1635"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#fcd34d"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="70" y="76" fill="#fffbeb" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">REPAIR IS A CONTRACTED SECOND PASS</text><text x="70" y="110" fill="#fde68a" font-family="Inter,Arial,sans-serif" font-size="16">A second generation is useful only if it answers the same question.</text><g font-family="Inter,Arial,sans-serif" filter="url(#s)"><rect x="85" y="220" width="230" height="125" rx="20" fill="#3b1d5a" stroke="#f472b6" stroke-width="2"/><text x="200" y="263" text-anchor="middle" fill="#fdf2f8" font-size="18" font-weight="700">PRIMARY</text><text x="200" y="292" text-anchor="middle" fill="#fbcfe8" font-size="15">model draft</text><text x="200" y="318" text-anchor="middle" fill="#fbcfe8" font-size="15">natural wording</text><rect x="380" y="220" width="230" height="125" rx="20" fill="#422006" stroke="#f59e0b" stroke-width="2"/><text x="495" y="263" text-anchor="middle" fill="#fff7ed" font-size="18" font-weight="700">VALIDATE</text><text x="495" y="292" text-anchor="middle" fill="#fed7aa" font-size="15">claims + stance</text><text x="495" y="318" text-anchor="middle" fill="#fed7aa" font-size="15">relationships</text><rect x="675" y="220" width="230" height="125" rx="20" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="790" y="263" text-anchor="middle" fill="#eef2ff" font-size="18" font-weight="700">DIAGNOSTICS</text><text x="790" y="292" text-anchor="middle" fill="#c7d2fe" font-size="15">errors, not facts</text><text x="790" y="318" text-anchor="middle" fill="#c7d2fe" font-size="15">preserve contract</text><rect x="970" y="220" width="145" height="125" rx="20" fill="#12352f" stroke="#2dd4bf" stroke-width="2"/><text x="1042" y="263" text-anchor="middle" fill="#f0fdfa" font-size="17" font-weight="700">ACCEPT</text><text x="1042" y="292" text-anchor="middle" fill="#99f6e4" font-size="15">or repair</text></g><path d="M315 282H375M610 282H670M905 282H965" stroke="#fcd34d" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1042 365V470H790V355" stroke="#2dd4bf" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="390" y="445" width="520" height="110" rx="20" fill="#111827" stroke="#67e8f9" stroke-width="2"/><text x="650" y="482" text-anchor="middle" fill="#e0f2fe" font-size="18" font-weight="700">REPAIR INPUT</text><text x="650" y="510" text-anchor="middle" fill="#bae6fd" font-size="14">question · proposition · stance · evidence</text><text x="650" y="535" text-anchor="middle" fill="#bae6fd" font-size="14">rejected draft is context, never evidence</text><path d="M390 500H280V355" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#a)"/></svg>