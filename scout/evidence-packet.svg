<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Clean evidence packet</title><desc id="d">A comparison between internal provenance retained by code and clean factual text shown to the language model.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071a1f"/><stop offset="1" stop-color="#102d3a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".35"/></filter></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="70" y="76" fill="#ecfeff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">EVIDENCE HAS TWO REPRESENTATIONS</text><text x="70" y="110" fill="#a5f3fc" font-family="Inter,Arial,sans-serif" font-size="16">Provenance stays structured. The model sees clean facts.</text><g font-family="Inter,Arial,sans-serif" filter="url(#s)"><rect x="70" y="180" width="470" height="330" rx="22" fill="#1f2937" stroke="#64748b" stroke-width="2"/><text x="105" y="225" fill="#f8fafc" font-size="20" font-weight="700">INTERNAL OBJECTS</text><text x="105" y="267" fill="#cbd5e1" font-size="15">{</text><text x="130" y="298" fill="#67e8f9" font-size="15">kind: "project"</text><text x="130" y="328" fill="#67e8f9" font-size="15">name: "ProjectHub"</text><text x="130" y="358" fill="#67e8f9" font-size="15">sourceBlock: "project-01"</text><text x="130" y="388" fill="#67e8f9" font-size="15">relation: "uses_tech"</text><text x="130" y="418" fill="#67e8f9" font-size="15">text: "Uses React and Node.js"</text><text x="105" y="456" fill="#cbd5e1" font-size="15">}</text><rect x="660" y="180" width="470" height="330" rx="22" fill="#12352f" stroke="#2dd4bf" stroke-width="2"/><text x="695" y="225" fill="#f0fdfa" font-size="20" font-weight="700">MODEL-VISIBLE FACTS</text><text x="695" y="285" fill="#ccfbf1" font-size="17">Evidence:</text><text x="725" y="325" fill="#99f6e4" font-size="16">• ProjectHub uses React</text><text x="725" y="360" fill="#99f6e4" font-size="16">• ProjectHub uses Node.js</text><text x="695" y="425" fill="#5eead4" font-size="14">No FACT 2</text><text x="695" y="450" fill="#5eead4" font-size="14">No [project-01]</text><text x="695" y="475" fill="#5eead4" font-size="14">No copyable internal IDs</text></g><path d="M540 345H650" stroke="#67e8f9" stroke-width="3" fill="none"/><circle cx="595" cy="345" r="16" fill="#67e8f9"/><path d="M588 345h14M595 338v14" stroke="#082f49" stroke-width="3"/><text x="600" y="590" text-anchor="middle" fill="#a5f3fc" font-family="Inter,Arial,sans-serif" font-size="16">The renderer changes the packet, not the facts.</text></svg>