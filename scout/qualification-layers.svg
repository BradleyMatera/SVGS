<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Scout qualification layers</title><desc id="d">Four stacked layers distinguish unit tests, retrieval tests, live conversation tests, and production health checks.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a1428"/><stop offset="1" stop-color="#182333"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".35"/></filter></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="70" y="76" fill="#eff6ff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">QUALIFICATION IS A STACK</text><text x="70" y="110" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="16">No single green check can prove a generative product is reliable.</text><g font-family="Inter,Arial,sans-serif" filter="url(#s)"><rect x="110" y="500" width="980" height="82" rx="18" fill="#12352f" stroke="#2dd4bf" stroke-width="2"/><text x="155" y="535" fill="#f0fdfa" font-size="18" font-weight="700">PRODUCTION HEALTH</text><text x="500" y="535" fill="#99f6e4" font-size="15">Which commit, branch, provider, model, and deadline are running?</text><rect x="170" y="388" width="860" height="82" rx="18" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="215" y="423" fill="#eef2ff" font-size="18" font-weight="700">LIVE CONVERSATIONS</text><text x="570" y="423" fill="#c7d2fe" font-size="15">Does the complete path preserve meaning across turns?</text><rect x="230" y="276" width="740" height="82" rx="18" fill="#3b1d5a" stroke="#f472b6" stroke-width="2"/><text x="275" y="311" fill="#fdf2f8" font-size="18" font-weight="700">RETRIEVAL</text><text x="535" y="311" fill="#fbcfe8" font-size="15">Can the correct evidence be found and ranked?</text><rect x="290" y="164" width="620" height="82" rx="18" fill="#422006" stroke="#f59e0b" stroke-width="2"/><text x="335" y="199" fill="#fff7ed" font-size="18" font-weight="700">UNIT TESTS</text><text x="565" y="199" fill="#fed7aa" font-size="15">Does each rule behave as written?</text></g><path d="M600 246V270M600 358V382M600 470V494" stroke="#bfdbfe" stroke-width="3"/></svg>