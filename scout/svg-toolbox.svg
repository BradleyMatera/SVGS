<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071226"/><stop offset="1" stop-color="#15113a"/></linearGradient><linearGradient id="cyan"><stop stop-color="#55e6ff"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="900" rx="38" fill="url(#bg)"/><circle cx="1400" cy="110" r="260" fill="#263d9a" opacity=".22"/><circle cx="180" cy="820" r="240" fill="#723ca7" opacity=".18"/><text x="86" y="110" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">WHY SVG IS PART OF THE TOOLBOX</text><text x="88" y="155" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="22">Technical visuals should be editable, scalable, and explainable</text>
<g font-family="Inter,Arial,sans-serif"><circle cx="330" cy="440" r="150" fill="#0b1d38" stroke="#55e6ff" stroke-width="4"/><circle cx="800" cy="440" r="150" fill="#201743" stroke="#d56bff" stroke-width="4"/><circle cx="1270" cy="440" r="150" fill="#162f36" stroke="#34d399" stroke-width="4"/><text x="330" y="425" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="700">SCALE</text><text x="330" y="468" text-anchor="middle" fill="#94a3b8" font-size="19">crisp at any size</text><text x="800" y="425" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="700">SOURCE</text><text x="800" y="468" text-anchor="middle" fill="#c4b5fd" font-size="19">diffable and editable</text><text x="1270" y="425" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="700">WEB</text><text x="1270" y="468" text-anchor="middle" fill="#a7f3d0" font-size="19">lightweight and linkable</text><text x="800" y="710" text-anchor="middle" fill="#dbeafe" font-size="24">Raster exports make the final article dependable; SVG keeps the design alive.</text></g><text x="88" y="838" fill="#55e6ff" font-family="Inter,Arial,sans-serif" font-size="16" letter-spacing="3">SCOUT / BUILD NOTE</text><text x="1510" y="838" text-anchor="end" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="15">Bradley Matera</text></svg>