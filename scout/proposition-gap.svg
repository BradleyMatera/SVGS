<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">LeetCode proposition distinction</title><desc id="d">Two separate question paths show that knowing LeetCode is unknown while documenting LeetCode as a gap is verified.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1024"/><stop offset="1" stop-color="#241332"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#c4b5fd"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="70" y="76" fill="#faf5ff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">ONE ENTITY · TWO PROPOSITIONS</text><text x="70" y="110" fill="#d8b4fe" font-family="Inter,Arial,sans-serif" font-size="16">The relationship requested by the user controls the answer.</text><g font-family="Inter,Arial,sans-serif" filter="url(#s)"><rect x="70" y="200" width="470" height="175" rx="22" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="305" y="238" text-anchor="middle" fill="#eef2ff" font-size="18" font-weight="700">QUESTION A</text><text x="305" y="276" text-anchor="middle" fill="#c7d2fe" font-size="19">Does Bradley know LeetCode?</text><text x="305" y="318" text-anchor="middle" fill="#fde68a" font-size="28" font-weight="700">UNKNOWN / QUALIFY</text><text x="305" y="347" text-anchor="middle" fill="#c7d2fe" font-size="14">A gap is not proficiency evidence.</text><rect x="660" y="200" width="470" height="175" rx="22" fill="#12352f" stroke="#2dd4bf" stroke-width="2"/><text x="895" y="238" text-anchor="middle" fill="#f0fdfa" font-size="18" font-weight="700">QUESTION B</text><text x="895" y="276" text-anchor="middle" fill="#ccfbf1" font-size="19">Is LeetCode documented as a gap?</text><text x="895" y="318" text-anchor="middle" fill="#5eead4" font-size="28" font-weight="700">YES / TRUE / AFFIRM</text><text x="895" y="347" text-anchor="middle" fill="#99f6e4" font-size="14">The requested has_gap relation is verified.</text></g><path d="M540 288H655" stroke="#c4b5fd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="250" y="468" width="700" height="90" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="2"/><text x="600" y="505" text-anchor="middle" fill="#ddd6fe" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">CONTRACT FIRST</text><text x="600" y="533" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="14">Classify the proposition before asking the model to phrase it.</text></svg>