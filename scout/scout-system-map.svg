<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Scout semantic reliability pipeline</title><desc id="d">A dark technical diagram showing a user question moving through conversation state, proposition support, evidence, a model, validation, and repair.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081225"/><stop offset="1" stop-color="#111d3d"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><linearGradient id="violet" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#67e8f9"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><circle cx="1040" cy="90" r="180" fill="#2563eb" opacity=".12"/><circle cx="130" cy="610" r="200" fill="#a855f7" opacity=".1"/><text x="72" y="82" fill="#e0f2fe" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">SCOUT / SEMANTIC RELIABILITY</text><text x="72" y="116" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">The model writes the answer. The system protects the meaning.</text><g filter="url(#shadow)" font-family="Inter,Arial,sans-serif"><g><rect x="72" y="205" width="170" height="108" rx="18" fill="#10284a" stroke="#38bdf8" stroke-width="2"/><text x="157" y="250" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">USER</text><text x="157" y="278" text-anchor="middle" fill="#bae6fd" font-size="14">question</text></g><g><rect x="290" y="205" width="190" height="108" rx="18" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="385" y="242" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">CONTEXT</text><text x="385" y="268" text-anchor="middle" fill="#c7d2fe" font-size="14">discourse frame</text><text x="385" y="290" text-anchor="middle" fill="#c7d2fe" font-size="14">active entity</text></g><g><rect x="528" y="205" width="190" height="108" rx="18" fill="#312e81" stroke="#a78bfa" stroke-width="2"/><text x="623" y="242" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">PROPOSITION</text><text x="623" y="268" text-anchor="middle" fill="#ddd6fe" font-size="14">what is being asked</text><text x="623" y="290" text-anchor="middle" fill="#ddd6fe" font-size="14">stance + evidence</text></g><g><rect x="766" y="205" width="190" height="108" rx="18" fill="#3b1d5a" stroke="#f472b6" stroke-width="2"/><text x="861" y="242" text-anchor="middle" fill="#fdf2f8" font-size="17" font-weight="700">MODEL</text><text x="861" y="268" text-anchor="middle" fill="#fbcfe8" font-size="14">natural language</text><text x="861" y="290" text-anchor="middle" fill="#fbcfe8" font-size="14">generation</text></g><g><rect x="1004" y="205" width="124" height="108" rx="18" fill="#422006" stroke="#f59e0b" stroke-width="2"/><text x="1066" y="242" text-anchor="middle" fill="#fff7ed" font-size="16" font-weight="700">CHECK</text><text x="1066" y="268" text-anchor="middle" fill="#fed7aa" font-size="14">claims</text><text x="1066" y="290" text-anchor="middle" fill="#fed7aa" font-size="14">stance</text></g></g><g stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M242 259H286"/><path d="M480 259H524"/><path d="M718 259H762"/><path d="M956 259H1000"/></g><path d="M1066 330V430H860" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="635" y="390" width="310" height="112" rx="18" fill="#172554" stroke="#22d3ee" stroke-width="2"/><text x="790" y="430" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">REPAIR / RECOVERY</text><text x="790" y="458" text-anchor="middle" fill="#bae6fd" font-family="Inter,Arial,sans-serif" font-size="14">same question · same contract</text><text x="790" y="480" text-anchor="middle" fill="#bae6fd" font-family="Inter,Arial,sans-serif" font-size="14">clean evidence · new wording</text><path d="M635 446H500V360H623V317" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="72" y="590" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="15">RETRIEVE → CONSTRAIN → GENERATE → VALIDATE → RECOVER</text><text x="1128" y="628" text-anchor="end" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">Bradley Matera / Scout</text></svg>