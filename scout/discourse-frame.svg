<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Scout discourse frame</title><desc id="d">A visual comparison frame showing frontend, DevOps, and QA as alternatives, with a separate facet question for deployment.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#18264d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#5eead4"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="70" y="78" fill="#f0fdfa" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">DISCOURSE FRAME</text><text x="70" y="112" fill="#99f6e4" font-family="Inter,Arial,sans-serif" font-size="16">A conversation is state, not just a transcript.</text><g font-family="Inter,Arial,sans-serif" filter="url(#shadow)"><rect x="70" y="177" width="300" height="90" rx="18" fill="#123047" stroke="#2dd4bf" stroke-width="2"/><text x="220" y="214" text-anchor="middle" fill="#f0fdfa" font-size="18" font-weight="700">USER TURNS</text><text x="220" y="242" text-anchor="middle" fill="#99f6e4" font-size="14">Frontend · DevOps · QA</text><rect x="450" y="150" width="300" height="144" rx="20" fill="#172554" stroke="#818cf8" stroke-width="2"/><text x="600" y="187" text-anchor="middle" fill="#eef2ff" font-size="18" font-weight="700">DISCOURSE FRAME</text><text x="600" y="218" text-anchor="middle" fill="#c7d2fe" font-size="14">ordered alternatives</text><text x="600" y="242" text-anchor="middle" fill="#c7d2fe" font-size="14">corrections + removals</text><text x="600" y="266" text-anchor="middle" fill="#c7d2fe" font-size="14">comparison intent</text><rect x="830" y="177" width="300" height="90" rx="18" fill="#3b1d5a" stroke="#f472b6" stroke-width="2"/><text x="980" y="214" text-anchor="middle" fill="#fdf2f8" font-size="18" font-weight="700">REQUEST</text><text x="980" y="242" text-anchor="middle" fill="#fbcfe8" font-size="14">Which is the strongest fit?</text></g><path d="M370 222H445" stroke="#5eead4" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M750 222H825" stroke="#5eead4" stroke-width="3" fill="none" marker-end="url(#a)"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="370" fill="#94a3b8" font-size="15">ALTERNATIVES</text><rect x="70" y="395" width="250" height="92" rx="16" fill="#0f2d4a" stroke="#38bdf8"/><text x="195" y="437" text-anchor="middle" fill="#e0f2fe" font-size="21" font-weight="700">Frontend</text><text x="195" y="463" text-anchor="middle" fill="#7dd3fc" font-size="14">member 1</text><rect x="350" y="395" width="250" height="92" rx="16" fill="#122d4d" stroke="#818cf8"/><text x="475" y="437" text-anchor="middle" fill="#eef2ff" font-size="21" font-weight="700">DevOps</text><text x="475" y="463" text-anchor="middle" fill="#c7d2fe" font-size="14">member 2</text><rect x="630" y="395" width="250" height="92" rx="16" fill="#33204e" stroke="#f472b6"/><text x="755" y="437" text-anchor="middle" fill="#fdf2f8" font-size="21" font-weight="700">QA</text><text x="755" y="463" text-anchor="middle" fill="#fbcfe8" font-size="14">member 3</text><rect x="910" y="395" width="220" height="92" rx="16" fill="#422006" stroke="#f59e0b"/><text x="1020" y="437" text-anchor="middle" fill="#fff7ed" font-size="18" font-weight="700">FACET</text><text x="1020" y="463" text-anchor="middle" fill="#fed7aa" font-size="14">deployment?</text><path d="M880 440H905" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="70" y="570" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="16">A facet asks about the current entity. An alternative changes the comparison set.</text></g></svg>